<!DOCTYPE html>
<html lang="fr" class="h-full bg-slate-950 text-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunii Web Studio - Transfert & Couvertures</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 9999px; }
    ::-webkit-scrollbar-thumb:hover { background: #475569; }
  </style>
</head>
<body class="h-full flex flex-col antialiased">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/70 backdrop-blur px-6 py-3.5 flex items-center justify-between">
    <div class="flex items-center gap-3">
      <div class="w-9 h-9 rounded-xl bg-teal-500/10 border border-teal-500/30 flex items-center justify-center text-teal-400 font-bold text-lg shadow-sm">
        L
      </div>
      <div>
        <h1 class="text-sm font-semibold text-white leading-tight">Lunii Web Studio</h1>
        <p class="text-xs text-slate-400">Gestionnaire bidirectionnel avec aperçu visuel</p>
      </div>
    </div>
    
    <div class="flex items-center gap-4">
      <!-- Indicateur de transfert -->
      <div id="transferIndicator" class="hidden items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 animate-pulse">
        <svg class="w-3.5 h-3.5 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8z"></path></svg>
        <span id="transferStatusText">Copie en cours...</span>
      </div>

      <!-- Statut Lunii -->
      <div id="deviceBadge" class="flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-slate-800 text-slate-400 border border-slate-700/60">
        <span class="w-2 h-2 rounded-full bg-slate-500"></span>
        Lunii non connectée
      </div>
    </div>
  </header>

  <!-- Grille 2 Colonnes -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-2 gap-6 min-h-0">

    <!-- Colonne GAUCHE : Bibliothèque PC -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl flex flex-col min-h-0 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-indigo-500/10 text-indigo-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-slate-200">Bibliothèque PC</h2>
            <p id="localDirLabel" class="text-xs text-slate-500 truncate max-w-[180px] sm:max-w-xs">Aucun dossier sélectionné</p>
          </div>
        </div>
        <button id="btnOpenLocal" class="bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white text-xs font-medium py-2 px-3 rounded-xl transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
          Dossier PC
        </button>
      </div>

      <!-- Liste packs locaux -->
      <div id="localPacksContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="localEmptyState" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 19a2 2 0 01-2-2V7a2 2 0 012-2h4l2 2h4a2 2 0 012 2v1M5 19h14a2 2 0 002-2v-5a2 2 0 00-2-2H9a2 2 0 00-2 2v5a2 2 0 01-2 2z"></path></svg>
          <p class="text-xs font-medium">Sélectionnez le dossier de vos histoires</p>
        </div>
      </div>
    </div>

    <!-- Colonne DROITE : Lunii -->
    <div class="bg-slate-900 border border-slate-800 rounded-2xl flex flex-col min-h-0 shadow-sm overflow-hidden">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/60">
        <div class="flex items-center gap-2.5">
          <div class="w-8 h-8 rounded-lg bg-teal-500/10 text-teal-400 flex items-center justify-center">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          </div>
          <div>
            <h2 class="text-sm font-semibold text-slate-200">Conteuse Lunii</h2>
            <p id="deviceMetaLabel" class="text-xs text-slate-500">Déconnectée</p>
          </div>
        </div>
        <button id="btnOpenDevice" class="bg-teal-500 hover:bg-teal-400 active:bg-teal-600 text-slate-950 text-xs font-semibold py-2 px-3 rounded-xl transition flex items-center gap-1.5">
          <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
          Connecter Lunii
        </button>
      </div>

      <!-- Liste packs Lunii -->
      <div id="devicePacksContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
        <div id="deviceEmptyState" class="h-full flex flex-col items-center justify-center text-center p-6 text-slate-500">
          <svg class="w-10 h-10 mb-2 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4v1m6 11h2m-6 0h-2v4m0-11v3m0 0h.01M12 12h4.01M16 20h4M4 12h4m12 0h.01M5 8h2a1 1 0 001-1V5a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1zm12 0h2a1 1 0 001-1V5a1 1 0 00-1-1h-2a1 1 0 00-1 1v2a1 1 0 001 1zM5 20h2a1 1 0 001-1v-2a1 1 0 00-1-1H5a1 1 0 00-1 1v2a1 1 0 001 1z"></path></svg>
          <p class="text-xs font-medium">Sélectionnez la carte SD de la Lunii</p>
        </div>
      </div>
    </div>

  </main>

  <script>
    let localDirHandle = null;
    let deviceRootHandle = null;
    let deviceContentHandle = null;
    let deviceMetadataHandle = null;

    let localPacks = [];
    let devicePacks = [];

    // Cache des object URLs pour libérer la mémoire lors des rechargements
    const activeBlobUrls = new Set();

    const btnOpenLocal = document.getElementById('btnOpenLocal');
    const btnOpenDevice = document.getElementById('btnOpenDevice');
    const localDirLabel = document.getElementById('localDirLabel');
    const deviceMetaLabel = document.getElementById('deviceMetaLabel');
    const deviceBadge = document.getElementById('deviceBadge');
    const localPacksContainer = document.getElementById('localPacksContainer');
    const devicePacksContainer = document.getElementById('devicePacksContainer');
    const localEmptyState = document.getElementById('localEmptyState');
    const deviceEmptyState = document.getElementById('deviceEmptyState');
    const transferIndicator = document.getElementById('transferIndicator');
    const transferStatusText = document.getElementById('transferStatusText');

    function createTrackedBlobUrl(blob) {
      const url = URL.createObjectURL(blob);
      activeBlobUrls.add(url);
      return url;
    }

    function cleanupBlobUrls() {
      for (const url of activeBlobUrls) {
        URL.revokeObjectURL(url);
      }
      activeBlobUrls.clear();
    }

    // Extraction ou recherche d'une image de couverture dans un dossier de pack
    async function extractCoverUrl(dirHandle) {
      const coverCandidates = [
        'thumbnail.png', 'thumbnail.jpg', 'cover.png', 'cover.jpg', 
        'icon.png', 'icon.jpg', 'cover.bmp', 'thumbnail.bmp'
      ];

      // 1. Chercher un fichier image classique nommé explicitement
      for (const name of coverCandidates) {
        try {
          const fileHandle = await dirHandle.getFileHandle(name);
          const file = await fileHandle.getFile();
          return createTrackedBlobUrl(file);
        } catch {
          // Non trouvé, on continue
        }
      }

      // 2. Parcourir les fichiers à la recherche de n'importe quelle image ou du dossier assets/images
      try {
        for await (const entry of dirHandle.values()) {
          if (entry.kind === 'file') {
            const lower = entry.name.toLowerCase();
            if (lower.endsWith('.png') || lower.endsWith('.jpg') || lower.endsWith('.jpeg')) {
              const file = await entry.getFile();
              return createTrackedBlobUrl(file);
            }
          } else if (entry.kind === 'directory' && (entry.name === 'images' || entry.name === 'assets')) {
            for await (const subEntry of entry.values()) {
              if (subEntry.kind === 'file') {
                const subLower = subEntry.name.toLowerCase();
                if (subLower.endsWith('.png') || subLower.endsWith('.jpg') || subLower.endsWith('.jpeg')) {
                  const file = await subEntry.getFile();
                  return createTrackedBlobUrl(file);
                }
              }
            }
          }
        }
      } catch (e) {
        console.warn("Impossible de scanner les images pour :", dirHandle.name, e);
      }

      return null;
    }

    // 1. Scan Dossier PC
    btnOpenLocal.addEventListener('click', async () => {
      try {
        localDirHandle = await window.showDirectoryPicker({ id: 'pc_stories', mode: 'readwrite' });
        localDirLabel.textContent = localDirHandle.name;
        await refreshLocalPacks();
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    });

    async function refreshLocalPacks() {
      if (!localDirHandle) return;
      localPacks = [];

      for await (const entry of localDirHandle.values()) {
        if (entry.kind === 'directory') {
          const coverUrl = await extractCoverUrl(entry);
          localPacks.push({ name: entry.name, handle: entry, coverUrl });
        }
      }

      renderLocalList();
    }

    function renderLocalList() {
      localPacksContainer.innerHTML = '';
      if (localPacks.length === 0) {
        localPacksContainer.appendChild(localEmptyState);
        localEmptyState.querySelector('p').textContent = 'Aucun pack trouvé dans ce dossier';
        return;
      }

      for (const pack of localPacks) {
        const row = document.createElement('div');
        row.className = 'bg-slate-800/40 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-3 flex items-center justify-between transition gap-3';
        
        // Thumbnail HTML
        const coverHtml = pack.coverUrl 
          ? `<img src="${pack.coverUrl}" alt="Cover" class="w-12 h-12 rounded-lg object-cover bg-slate-900 border border-slate-700/60 shrink-0 shadow-inner">`
          : `<div class="w-12 h-12 rounded-lg bg-indigo-500/10 border border-indigo-500/20 text-indigo-400 flex items-center justify-center shrink-0">
               <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
             </div>`;

        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            ${coverHtml}
            <div class="min-w-0">
              <p class="text-xs font-semibold text-slate-200 truncate">${pack.name}</p>
              <p class="text-[10px] text-slate-500">Pack local</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button class="btn-copy bg-teal-500/10 hover:bg-teal-500 text-teal-400 hover:text-slate-950 border border-teal-500/20 text-xs font-medium px-2.5 py-1.5 rounded-lg transition flex items-center gap-1">
              <span>Transférer</span>
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
            </button>
            <button class="btn-delete text-slate-500 hover:text-rose-400 p-1.5 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;

        row.querySelector('.btn-copy').addEventListener('click', async () => {
          if (!deviceContentHandle) {
            alert("Connectez d'abord la Lunii dans la colonne de droite.");
            return;
          }
          await transferPackToDevice(pack);
        });

        row.querySelector('.btn-delete').addEventListener('click', async () => {
          if (confirm(`Supprimer le dossier local "${pack.name}" ?`)) {
            await localDirHandle.removeEntry(pack.name, { recursive: true });
            await refreshLocalPacks();
          }
        });

        localPacksContainer.appendChild(row);
      }
    }

    // 2. Scan Lunii
    btnOpenDevice.addEventListener('click', async () => {
      try {
        deviceRootHandle = await window.showDirectoryPicker({ id: 'lunii_sd', mode: 'readwrite' });
        await inspectLuniiDevice();
      } catch (e) {
        if (e.name !== 'AbortError') console.error(e);
      }
    });

    async function inspectLuniiDevice() {
      let isLunii = false;
      let model = 'Lunii V2';

      for await (const entry of deviceRootHandle.values()) {
        if (entry.kind === 'directory' && (entry.name === '.content' || entry.name === 'content')) {
          deviceContentHandle = entry;
          isLunii = true;
        }
        if (entry.kind === 'file' && (entry.name === 'md' || entry.name === '.md')) {
          deviceMetadataHandle = entry;
          if (entry.name === '.md') model = 'Lunii V3';
        }
      }

      if (!isLunii) {
        alert("La racine sélectionnée ne contient pas de dossier '.content' ou 'content'.");
        return;
      }

      deviceBadge.innerHTML = `<span class="w-2 h-2 rounded-full bg-emerald-400"></span> ${model} connectée`;
      deviceBadge.className = 'flex items-center gap-2 text-xs font-medium px-3 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
      deviceMetaLabel.textContent = `${model} (Fichier: ${deviceMetadataHandle ? deviceMetadataHandle.name : 'aucun'})`;

      await refreshDevicePacks();
    }

    async function refreshDevicePacks() {
      if (!deviceContentHandle) return;
      devicePacks = [];

      for await (const entry of deviceContentHandle.values()) {
        if (entry.kind === 'directory') {
          const coverUrl = await extractCoverUrl(entry);
          devicePacks.push({ name: entry.name, handle: entry, coverUrl });
        }
      }

      renderDeviceList();
    }

    function renderDeviceList() {
      devicePacksContainer.innerHTML = '';
      if (devicePacks.length === 0) {
        devicePacksContainer.appendChild(deviceEmptyState);
        deviceEmptyState.querySelector('p').textContent = 'Aucune histoire sur la liseuse';
        return;
      }

      for (const pack of devicePacks) {
        const row = document.createElement('div');
        row.className = 'bg-slate-800/40 border border-slate-800/80 hover:border-slate-700/80 rounded-xl p-3 flex items-center justify-between transition gap-3';
        
        const coverHtml = pack.coverUrl 
          ? `<img src="${pack.coverUrl}" alt="Cover" class="w-12 h-12 rounded-lg object-cover bg-slate-900 border border-slate-700/60 shrink-0 shadow-inner">`
          : `<div class="w-12 h-12 rounded-lg bg-teal-500/10 border border-teal-500/20 text-teal-400 flex items-center justify-center shrink-0">
               <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
             </div>`;

        row.innerHTML = `
          <div class="flex items-center gap-3 min-w-0">
            ${coverHtml}
            <div class="min-w-0">
              <p class="text-xs font-mono font-medium text-slate-200 truncate">${pack.name}</p>
              <p class="text-[10px] text-teal-500/80">Pack installé</p>
            </div>
          </div>
          <div class="flex items-center gap-1.5 shrink-0">
            <button class="btn-backup bg-indigo-500/10 hover:bg-indigo-600 text-indigo-400 hover:text-white border border-indigo-500/20 text-xs font-medium px-2.5 py-1.5 rounded-lg transition flex items-center gap-1">
              <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
              <span>Extraire</span>
            </button>
            <button class="btn-delete text-slate-500 hover:text-rose-400 p-1.5 transition">
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
            </button>
          </div>
        `;

        row.querySelector('.btn-backup').addEventListener('click', async () => {
          if (!localDirHandle) {
            alert("Choisissez d'abord un dossier local dans la colonne de gauche.");
            return;
          }
          await transferPackToLocal(pack);
        });

        row.querySelector('.btn-delete').addEventListener('click', async () => {
          if (confirm(`Supprimer le pack "${pack.name}" de la Lunii ?`)) {
            await deviceContentHandle.removeEntry(pack.name, { recursive: true });
            await refreshDevicePacks();
          }
        });

        devicePacksContainer.appendChild(row);
      }
    }

    // 3. Moteur de copie récursive
    async function copyDirectoryRecursive(srcHandle, destParentHandle, newDirName, onProgress) {
      const targetDir = await destParentHandle.getDirectoryHandle(newDirName, { create: true });
      
      for await (const entry of srcHandle.values()) {
        if (entry.kind === 'file') {
          if (onProgress) onProgress(entry.name);
          const file = await entry.getFile();
          const targetFile = await targetDir.getFileHandle(entry.name, { create: true });
          const writable = await targetFile.createWritable();
          await writable.write(await file.arrayBuffer());
          await writable.close();
        } else if (entry.kind === 'directory') {
          await copyDirectoryRecursive(entry, targetDir, entry.name, onProgress);
        }
      }
    }

    async function transferPackToDevice(pack) {
      setBusy(true, `Copie de "${pack.name}" vers la Lunii...`);
      try {
        await copyDirectoryRecursive(pack.handle, deviceContentHandle, pack.name, (filename) => {
          transferStatusText.textContent = `Écriture : ${filename}`;
        });
        await refreshDevicePacks();
      } catch (err) {
        console.error(err);
        alert("Erreur de transfert : " + err.message);
      } finally {
        setBusy(false);
      }
    }

    async function transferPackToLocal(pack) {
      setBusy(true, `Extraction de "${pack.name}" vers le PC...`);
      try {
        await copyDirectoryRecursive(pack.handle, localDirHandle, pack.name, (filename) => {
          transferStatusText.textContent = `Lecture : ${filename}`;
        });
        await refreshLocalPacks();
      } catch (err) {
        console.error(err);
        alert("Erreur d'extraction : " + err.message);
      } finally {
        setBusy(false);
      }
    }

    function setBusy(busy, message) {
      if (busy) {
        transferStatusText.textContent = message;
        transferIndicator.classList.remove('hidden');
        transferIndicator.classList.add('flex');
        btnOpenLocal.disabled = true;
        btnOpenDevice.disabled = true;
      } else {
        transferIndicator.classList.add('hidden');
        transferIndicator.classList.remove('flex');
        btnOpenLocal.disabled = false;
        btnOpenDevice.disabled = false;
      }
    }
  </script>
</body>
</html>
